# ONLY this server_name — does not touch other vhosts.
# Install as: /etc/nginx/sites-available/finance.arix.vu
# Enable:     ln -s /etc/nginx/sites-available/finance.arix.vu /etc/nginx/sites-enabled/
# Then:       nginx -t && systemctl reload nginx

upstream finance_app {
    server 127.0.0.1:3010;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name finance.arix.vu;

    # Certbot will replace this block with HTTPS after:
    # certbot --nginx -d finance.arix.vu

    client_max_body_size 10m;

    location / {
        proxy_pass http://finance_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
